<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Product preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="first_card" class="card">
        <picture>
          <source
            media="(max-width: 768px)"
            srcset="./images/image-product-mobile.jpg"
          />
          <img
            class="product-image"
            src="./images/image-product-desktop.jpg"
            alt="Image of perfume"
          />
        </picture>
      </div>
      <div id="second_card" class="card">
        <p id="first_paragraph">PERFUME</p>
        <h1 id="first_heading">Gabrielle Essence Eau De Parfum</h1>
        <p id="second_paragraph">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div id="price">
          <h1 id="second_heading">$149.99</h1>
          <p id="third_paragraph">$169.99</p>
        </div>
        <button id="button">
          <img
            id="small_icon"
            src="./images/icon-cart.svg"
            alt="icon of the cart"
          />
          Add to Cart
        </button>
      </div>
    </div>

    <!-- <footer class="attribution"> 
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>  -->
  </body>
</html>
